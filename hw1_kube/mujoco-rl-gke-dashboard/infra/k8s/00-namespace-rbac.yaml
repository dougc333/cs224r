apiVersion: v1
kind: Namespace
metadata:
  name: rl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rl-dashboard
  namespace: rl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rl-trainer
  namespace: rl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rl-dashboard-role
  namespace: rl
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rl-dashboard-rolebinding
  namespace: rl
subjects:
  - kind: ServiceAccount
    name: rl-dashboard
    namespace: rl
roleRef:
  kind: Role
  name: rl-dashboard-role
  apiGroup: rbac.authorization.k8s.io
