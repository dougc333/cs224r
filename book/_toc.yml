    chapters:
      - caption: hw2 This uses mujoco-mpc where mpc means model predctive controller. A controller is a common patter in RL where it adds trajectories to get the system working without the use of RL. This is a common pattern in robotics and agent systems. Always start with a controller first to do supervised learning then do fine tuning with RL as the next setp. Mujoco MPC introduces a linear system with quadratic constraints where the solution can get the simulated robots to do simple locomotion and robot arms simple manipulation. 
    chapters:
      - caption: hw3 This uses a version derived from mujoco xla, the pointmass environment. It is the ant robot walking in a maze. The common approach is to use a hierarchial RL algorithm for this, there are 2 tasks, get the ant to walk then get ant to find the goal of the maze. This involves the use of a low level controller and a high level maze solver planner both of which dont use RL. Then mix the controller/planner with RL to fine tune performance. This is similar to many higher level scenarios in real life like self driving cars and coding LLMs which have to solve problems at 2 levels, a lower level and higher level. The higher level goals are broken into subgoals and the connection of the subgoals yeilds a solution. 


