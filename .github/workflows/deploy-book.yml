name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # The root requirements are for course code, not the book build toolchain.
          python -m pip install "jupyter-book>=1,<2"

      - name: Build Jupyter Book
        run: |
          JUPYTER_BOOK="$(python -c 'import os,sysconfig; print(os.path.join(sysconfig.get_path("scripts"), "jupyter-book"))')"
          "$JUPYTER_BOOK" --version
          "$JUPYTER_BOOK" build book/

      - name: Debug build output
        run: |
          echo "== book contents =="; ls -la book
          echo "== book/_build contents =="; ls -la book/_build || true
          echo "== book/_build/html contents =="; ls -la book/_build/html || true
          test -f book/_build/html/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
